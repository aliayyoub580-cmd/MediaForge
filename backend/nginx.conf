server {
    listen 80;
    server_name mediaforge.pro www.mediaforge.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mediaforge.pro www.mediaforge.pro;

    # SSL (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/mediaforge.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mediaforge.pro/privkey.pem;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Frontend SPA (Vite dist/)
    root /var/www/mediaforge/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to Express
    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
